spring:
  application:
    name: DriveStore
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:drivestore}${DB_PARAMS:}
    username: ${DB_USERNAME:drivestore}
    password: ${DB_PASSWORD:drivestore}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

jwt:
  secret: ${JWT_SECRET:ZHJpdmVzdG9yZS1zZWNyZXQta2V5LW11c3QtYmUtYXQtbGVhc3QtMjU2LWJpdHM=}
  expiration: ${JWT_EXPIRATION:86400000}

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}

app:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:4200}

logging:
  level:
    com.drivestore: INFO
    org.springframework.web: WARN
    org.springframework.security: WARN
  pattern:
    console: "%d{HH:mm:ss} [%-5level] %logger{36} - %msg%n"

server:
  port: ${PORT:8080}
