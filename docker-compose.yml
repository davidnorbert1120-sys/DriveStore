version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: drivestore-db
    environment:
      POSTGRES_DB: drivestore
      POSTGRES_USER: drivestore
      POSTGRES_PASSWORD: drivestore
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
